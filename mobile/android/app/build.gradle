import java.nio.charset.StandardCharsets

apply plugin: 'com.android.application'

android {
    namespace "org.love2d.android.executable"
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId project.properties["app.application_id"]
        versionCode project.properties["app.version_code"].toInteger()
        versionName project.properties["app.version_name"]
        minSdk 16
        compileSdk 34
        targetSdk 34
        
        def getAppName = {
            def override = project.findProperty("app.display_name")
            if (override != null && !override.toString().trim().isEmpty()) {
                return override.toString()
            }
            def nameArray = project.properties["app.name_byte_array"]
            def name = project.properties["app.name"]
            if (name != null && nameArray != null) {
                throw new Exception("Only define either `app.name` or `app.name_byte_array` in gradle.properties, but not both!")
            }

            if (name == null) {
                def nameArraySplit = nameArray.split(",")
                def nameBytes = new byte[nameArraySplit.length]
                def count = 0
                for (String s: nameArraySplit) {
                    nameBytes[count++] = (byte) Integer.parseInt(s)
                }
                return new String(nameBytes, StandardCharsets.UTF_8)
            }
            return name
        }

        // All locally-built variants use the same launcher source. Only this
        // explicit diagnostic switch and the visible label may differ.
        def diagnosticEnabled = project.findProperty("app.diagnostic")
        buildConfigField "boolean", "DIAGNOSTIC",
            diagnosticEnabled != null && diagnosticEnabled.toString().toBoolean() ? "true" : "false"

        manifestPlaceholders = [
            NAME:getAppName(),
            ORIENTATION:project.properties["app.orientation"],
            ACTIVITY:"org.love2d.android.GameActivity",
        ]
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions = ['mode', 'recording']
    productFlavors {
        normal {
            dimension 'mode'
        }
        embed {
            dimension 'mode'
        }
        questVr {
            dimension 'mode'
            minSdk 24
            matchingFallbacks = ['embed']
            ndk {
                abiFilters 'arm64-v8a'
            }
            manifestPlaceholders = [
                ACTIVITY:"org.love2d.android.QuestGameActivity",
            ]
        }
        record {
            dimension 'recording'
        }
        noRecord {
            dimension 'recording'
        }
    }
    lint {
        abortOnError false
    }
    sourceSets {
        questVr {
            assets.srcDirs = ['src/embed/assets']
        }
    }
}

dependencies {
    api 'androidx.multidex:multidex:2.0.1'
    api fileTree(dir: 'libs', include: ['*.jar'])
    api 'androidx.appcompat:appcompat:1.8.0'
    api project(':love')
    // Khronos' official Android OpenXR loader. The flavor-scoped native bridge
    // resolves it at runtime; the AAR also contributes the loader's required
    // global Android manifest declarations.
    questVrImplementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
